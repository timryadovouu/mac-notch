name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & package
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Package mac-notch.app
        run: ./build-app.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: mac-notch-app
          path: mac-notch.app
          if-no-files-found: error
